name: Refresh jobs
on:
  schedule:
    - cron: "0 11 * * *"   # daily, about 7am US Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: refresh-jobs       # never run two refreshes at the same time
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the job agent
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python job_agent.py > /dev/null
      - name: Save the results
        run: |
          git config user.name "job-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --staged --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Update jobs"
          # If someone pushed to the repository while this run was working, pull their changes in first,
          # keeping the freshly built jobs.json if the two collide, then push. Try a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true; sleep 6
          done
          exit 1
