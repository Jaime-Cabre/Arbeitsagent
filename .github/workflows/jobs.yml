name: Refresh jobs
on:
  schedule:
    - cron: "0 11 * * *"   # daily, about 7am US Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the job agent
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python job_agent.py > /dev/null
      - name: Save the results
        run: |
          git config user.name "job-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jobs.json
          git diff --staged --quiet || (git commit -m "Update jobs" && git push)
