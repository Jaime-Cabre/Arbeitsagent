name: Refresh jobs
on:
  schedule:
    - cron: "0 11 * * *"   # daily, about 7am US Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: refresh-jobs       # never run two refreshes at the same time
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the job agent
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python job_agent.py > /dev/null
      - name: Save the results
        run: |
          git config user.name "job-board-bot"
          git config user.email "actions@users.noreply.github.com"
          cp docs/jobs.json /tmp/jobs.json
          # Start each attempt from the newest copy of the branch, put the fresh results on top, then push.
          # This cannot hit a rebase conflict, and it retries if someone else pushes at the same moment.
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p docs && cp /tmp/jobs.json docs/jobs.json
            git add docs/jobs.json
            if git diff --staged --quiet; then echo "No changes to save"; exit 0; fi
            git commit -m "Update jobs"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then echo "Saved"; exit 0; fi
            echo "Push attempt $i failed; retrying"; sleep 6
          done
          echo "Could not save after 5 attempts"; exit 1
